name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Links to other people's sites rot without anyone touching this repo.
    - cron: "0 9 1 * *"

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill structure, private paths, and internal links
        run: python3 scripts/validate_skills.py

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin manifests are well-formed JSON
        run: |
          for f in .claude-plugin/*.json .codex-plugin/*.json .agents/plugins/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok $f"
          done

  links:
    runs-on: ubuntu-latest
    # A dead outbound link is worth knowing about, but it is somebody else's
    # site going down — it should not block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check outbound links resolve
        run: |
          set -u
          urls=$(grep -rhoE 'https?://[^ )"'"'"'`>]+' --include='*.md' --include='*.json' . \
                 | tr -d '<>' | sed 's/[.,]*$//' | sort -u)
          fail=0
          for u in $urls; do
              # Every github.com link in this repo is a self-reference, and they
            # cannot be checked from CI: they 404 while the repo is private, and
            # they point at the intended name during a rename. Skip by owner so
            # neither a rename nor going public can stale this.
            case "$u" in "https://github.com/${GITHUB_REPOSITORY%%/*}/"*) continue ;; esac

            code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 25 \
                     -A 'Mozilla/5.0 (compatible; repo link check)' "$u" || echo 000)
            case "$code" in
              2*|3*) ;;
              # Alive, but gated against bots (scrum.org does this). A link
              # checker that calls these dead just trains you to ignore it.
              401|403|405|406|429) echo "note: $code (bot-gated, treating as live) $u" ;;
              *) echo "::warning::$code $u"; fail=1 ;;
            esac
          done
          exit $fail
